[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "three-gen-subnet-trellis"
version = "0.1.0"
description = "Three Generation Subnet Trellis - A comprehensive AI/ML validation and optimization framework"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Trellis Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "torchvision==0.19.0",
    "torchmetrics==1.8.1",
    "transformers==4.44.2",
    "huggingface_hub>=0.23.0",
    "open_clip_torch==2.29.0",
    "openai-clip==1.0.1",
    "meshio==5.3.5",
    "imageio==2.35.1",
    "pillow>=10.0.0,<11.0.0",
    "zstandard==0.23.0",
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "pybase64==1.4.0",
    "loguru==0.7.3",
    "scikit-learn==1.6.1",
    "joblib>=1.3.0",
    "pytorch_lightning==2.5.2",
    "pyod==2.0.5",
    "pytod==0.0.3",
    "requests>=2.32.0",
    "ninja==1.11.1.1",
    "setuptools==65.5.1",
    "packaging>=24.0",
]

# Note: Some packages require special installation:
# - gsplat: pip install git+https://github.com/nerfstudio-project/gsplat.git@2323de5905d5e90e035f792fe65bad0fedd413e7
# - pyspz: pip install git+https://github.com/404-Repo/spz.git@0.1

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/your-org/three-gen-subnet-trellis"
Repository = "https://github.com/your-org/three-gen-subnet-trellis.git"
Issues = "https://github.com/your-org/three-gen-subnet-trellis/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = [
    "tests*",
    "test_*",
    "*_test.py",
    "*.pyc",
    "__pycache__",
    ".git*",
    "*.log",
    "*.db",
    "*.csv",
    "*.json",
    "*.jsonl",
    "*.md",
    "*.txt",
    "*.sh",
    "*.ipynb",
    "*.tar",
    "cache*",
    "offline*",
    "episodic_log*",
    "trellis_*",
    "continuous_*",
    "LORAS*",
    "resources*",
    "validation*",
    "finetune*",
    "image-interrogator*",
    "three-gen-subnet*",
    "Hi3DGen*",
    "3DTopia-XL*",
    "TRELLIS*",
    "neurons*",
    "spz*",
    "kaolin*",
]

[tool.setuptools.package-data]
"*" = ["*.py", "*.pyi", "*.txt", "*.md", "*.json", "*.yaml", "*.yml"] 